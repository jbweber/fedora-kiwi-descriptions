version = 2

# Minimal containerd configuration for Kubernetes
# Using containerd v2 plugin paths

[plugins]
  [plugins.'io.containerd.cri.v1.runtime']
    # Enable device ownership from security context
    # This allows non-root containers (like KubeVirt VMs) to access block devices
    # Required for volumeMode: Block with Ceph RBD in KubeVirt
    device_ownership_from_security_context = true

    [plugins.'io.containerd.cri.v1.runtime'.cni]
      # bin_dir is deprecated in v2, use bin_dirs
      bin_dir = ""
      # Search for CNI plugins in system location first, then writable location
      bin_dirs = ["/usr/libexec/cni", "/var/lib/cni/bin"]
      conf_dir = "/etc/cni/net.d"
  [plugins."io.containerd.internal.v1.opt"]
    path = "/var/lib/containerd/opt"
